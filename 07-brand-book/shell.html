<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">
<style>
  :root{
    --orange:#E2531E; --white:#ffffff; --ink:#16130F;
    --paper:#ffffff; --line:rgba(22,19,15,.14);
    --ff:'Paperlogy','Pretendard',sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --maxw:1200px; --side:212px; --headh:59px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--headh) + 20px)}
  body{background:var(--white);color:var(--ink);font-family:var(--ff);font-weight:400;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* ---------- top bar ---------- */
  header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--ink)}
  .nav{max-width:var(--maxw);margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px}
  .brandmark{display:flex;align-items:center;flex:0 0 auto}
  .brandmark img{height:22px;width:auto;display:block}
  .tabs{display:flex;gap:4px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    text-decoration:none;border:1.5px solid transparent;color:var(--ink);padding:7px 13px;border-radius:2px;
    white-space:nowrap;transition:.12s ease-out}
  .tabs a:hover{border-color:var(--line)}
  .tabs a.on{background:var(--ink);color:var(--white)}
  .navtools{display:flex;align-items:center;gap:8px;flex:0 0 auto}

  .tbtn{font-family:var(--ff);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:1.5px solid var(--line);color:var(--ink);padding:6px 11px;border-radius:3px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:.12s ease-out;white-space:nowrap}
  .tbtn:hover{border-color:var(--orange);color:var(--orange)}
  .tbtn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}

  /* download dropdown */
  .dd{position:relative}
  .dd>summary{list-style:none;cursor:pointer}
  .dd>summary::-webkit-details-marker{display:none}
  .dd[open]>summary .caret{transform:rotate(180deg)}
  .caret{font-size:9px;transition:.14s}
  .ddmenu{position:absolute;right:0;top:calc(100% + 7px);min-width:216px;background:var(--white);
    border:1.5px solid var(--ink);border-radius:5px;box-shadow:0 10px 30px rgba(22,19,15,.13);padding:5px;z-index:70}
  .ddmenu a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:9px 11px;border-radius:3px;text-decoration:none;font-size:13.5px;font-weight:600;transition:.1s}
  .ddmenu a:hover{background:rgba(226,83,30,.09);color:var(--orange)}
  .ddmenu a small{font-family:var(--mono);font-size:10.5px;font-weight:400;color:rgba(22,19,15,.45);white-space:nowrap}
  .ddmenu a:hover small{color:var(--orange)}
  .ddmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

  /* ---------- layout ---------- */
  .shell{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:var(--side) 1fr;gap:44px;align-items:start}
  main{min-width:0;padding-bottom:140px}

  /* ---------- sidebar TOC ---------- */
  .toc{position:sticky;top:calc(var(--headh) + 34px);padding:34px 0 40px;font-size:13px}
  .toc .tt{font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(22,19,15,.42);margin-bottom:12px}
  .toc ol{list-style:none}
  .toc li{margin:0}
  .toc a{display:flex;gap:9px;padding:5px 0 5px 10px;text-decoration:none;color:rgba(22,19,15,.62);
    border-left:2px solid var(--line);line-height:1.4;transition:.12s ease-out}
  .toc a:hover{color:var(--ink);border-left-color:rgba(22,19,15,.4)}
  .toc a.on{color:var(--orange);border-left-color:var(--orange);font-weight:600}
  .toc a .n{font-family:var(--mono);font-size:11px;opacity:.62;flex:0 0 auto}
  .toc .other{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  .toc .other a{border-left:0;padding-left:0;font-size:12.5px}
  .toc .other .tt{margin-bottom:8px}

  /* ---------- hero ---------- */
  .hero{padding:60px 0 38px;border-bottom:1.5px solid var(--ink)}
  .kicker{font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
  .hero h1{font-weight:600;font-size:clamp(38px,6.4vw,62px);line-height:1;letter-spacing:-.02em;margin:14px 0 16px}
  .hero .lede{max-width:620px;font-size:16.5px;color:rgba(22,19,15,.72)}
  .hero .lede p{margin:0 0 6px}
  .hero .lede code{font-size:.9em}

  /* ---------- sections ---------- */
  section{padding:50px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--headh) + 20px)}
  .snum{font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
  h2{font-weight:600;font-size:28px;letter-spacing:-.01em;margin:6px 0 20px}
  h3{font-weight:600;font-size:17.5px;margin:28px 0 10px}
  h4{font-weight:600;font-size:15px;margin:20px 0 8px;color:rgba(22,19,15,.75)}
  p{margin:0 0 12px}
  ul,ol{margin:0 0 14px;padding-left:20px}li{margin:5px 0}
  strong{font-weight:600}
  a.ext{color:var(--orange)}
  code{font-family:var(--mono);font-size:.87em;background:rgba(22,19,15,.07);padding:2px 6px;border-radius:3px}
  pre{background:rgba(22,19,15,.05);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;margin:14px 0}
  pre code{background:none;padding:0;font-size:12.5px;line-height:1.75}
  hr{border:0;border-top:1px solid var(--line);margin:26px 0}

  table{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:14.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(22,19,15,.6);border-bottom:1.5px solid var(--ink)}
  tr:hover td{background:rgba(226,83,30,.04)}
  .tablewrap{overflow-x:auto;margin:14px 0 20px}
  .tablewrap table{margin:0}
  /* 식별자 열(E-1 · 토큰명)이 글자 단위로 접히지 않게 — 넘치면 표가 가로로 스크롤된다 */
  td:first-child,th:first-child{white-space:nowrap}
  td code{white-space:nowrap}

  /* blockquote → note callout */
  blockquote{background:var(--paper);border-left:3px solid var(--orange);padding:12px 16px;
    border-radius:0 4px 4px 0;font-size:14px;margin:16px 0}
  blockquote p:last-child{margin-bottom:0}

  /* ---------- swatches ---------- */
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin:18px 0}
  .sw{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
  .sw .chip{height:78px}
  .sw .meta{padding:10px 12px}
  .sw .nm{font-weight:600;font-size:14px}
  .sw .hex{font-family:var(--mono);font-size:12px;color:rgba(22,19,15,.6);margin-top:3px}
  .sw .use{font-size:12px;color:rgba(22,19,15,.6);margin-top:6px;line-height:1.4}

  /* ---------- logo chips ---------- */
  .logobox{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:16px;margin:18px 0}
  .lchip{min-width:0;padding:32px 20px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:7px;
    border:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;transition:.12s ease-out}
  .lchip:hover{border-color:var(--orange)}
  .lchip.light{background:var(--paper)}
  .lchip.dark{background:var(--ink);color:var(--white)}
  .lchip.orange{background:var(--orange);color:#fff}
  .lchip .dlhint{font-size:9px;letter-spacing:.06em;color:var(--orange);opacity:0;transition:.12s}
  .lchip:hover .dlhint{opacity:1}
  .lchip.dark .dlhint,.lchip.orange .dlhint{color:#fff}
  .lchip img{height:70px;width:auto;display:block;max-width:100%}
  .lchip.h img{height:34px}
  .plabel{font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}

  /* inline download row */
  .dl{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:6px 0 10px}
  .dl-label{font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(22,19,15,.55)}
  .dl a{font-size:12.5px;font-weight:600;text-decoration:none;border:1.5px solid var(--line);border-radius:3px;padding:5px 11px;transition:.12s ease-out}
  .dl a:hover{border-color:var(--orange);color:var(--orange)}

  /* ---------- cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:14px;margin:16px 0}
  .card{border:1.5px solid var(--ink);border-radius:6px;padding:18px 18px 20px;background:var(--paper)}
  .card .t{font-weight:600;font-size:16px;margin-bottom:2px}
  .card .t.warn{color:var(--orange)}
  .card .anb{font-size:13px;color:var(--orange);font-weight:600;margin-bottom:10px}
  .card ul{margin:0;padding-left:17px;font-size:13.5px}
  .say{font-size:13.5px;margin-top:8px}
  .say.no{color:rgba(22,19,15,.5)}
  .say b{font-weight:600}

  .pill{display:inline-block;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    padding:5px 12px;border:1.5px solid var(--ink);border-radius:3px;margin:0 6px 6px 0}
  .pill.on{background:var(--orange);color:#fff;border-color:var(--orange)}

  /* ---------- picto / mode grids ---------- */
  .pictos{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px;margin:16px 0}
  .picto{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 10px;
    border:1px solid var(--line);border-radius:6px;background:var(--paper);text-decoration:none;color:inherit;transition:.12s ease-out}
  .picto:hover{border-color:var(--orange)}
  .picto img{width:38px;height:38px;object-fit:contain}
  .picto span{font-size:11.5px;font-weight:600;color:rgba(22,19,15,.7);text-align:center;line-height:1.3}
  .picto small{font-size:9px;letter-spacing:.06em;color:var(--orange);opacity:0;transition:.12s}
  .picto:hover small{opacity:1}

  .modetags{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
  .mtag{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 20px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper);text-decoration:none;color:inherit;transition:.12s ease-out}
  .mtag:hover{border-color:var(--orange)}
  .mtag img{height:32px;width:auto;display:block}
  .mtag small{font-size:9px;letter-spacing:.06em;color:var(--orange);opacity:0;transition:.12s}
  .mtag:hover small{opacity:1}

  /* ---------- photos ---------- */
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0}
  .shot{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
  .shot .ph{background:#EFEDE9;display:flex;align-items:center;justify-content:center;height:300px}
  .shot .ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .shot .cap{padding:11px 13px;border-top:1px solid var(--line)}
  .shot .cap .tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--orange);margin-bottom:4px}
  .shot .cap b{font-weight:600;font-size:14.5px;display:block}
  .shot .cap span{font-size:12.5px;color:rgba(22,19,15,.62);line-height:1.45;display:block;margin-top:4px}
  .shots.wide{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
  .shots.wide .ph{height:340px}

  /* ---------- A5 sheets ---------- */
  .sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin:18px 0}
  .sheets.land{grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
  .sheet{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);
    text-decoration:none;color:inherit;display:block;transition:.12s ease-out}
  .sheet:hover{border-color:var(--orange)}
  .sheet img{width:100%;height:auto;display:block;background:#fff}
  .sheet .cap{padding:8px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .sheet .cap b{font-weight:600;font-size:12.5px}
  .sheet .cap small{font-size:9px;letter-spacing:.06em;color:var(--orange);opacity:0;transition:.12s;white-space:nowrap}
  .sheet:hover .cap small{opacity:1}

  /* ---------- type specimen ---------- */
  .spec{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0}
  .spec div{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:18px}
  .spec div:last-child{border-bottom:0}
  .spec .sm{font-family:var(--mono);font-size:10.5px;color:rgba(22,19,15,.42);white-space:nowrap;flex:0 0 auto}
  .spec .sv{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- sequence ---------- */
  .seq{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:18px 0;
    font-size:13.5px;line-height:1.9;overflow-x:auto;white-space:nowrap}
  .seq b{font-weight:600}
  .seq .ar{color:var(--orange);margin:0 8px}

  /* ---------- asset download center ---------- */
  .kit{border:1.5px solid var(--ink);border-radius:6px;padding:18px 20px;margin:18px 0;display:flex;
    align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .kit .kt{font-weight:600;font-size:16px}
  .kit .ks{font-size:13px;color:rgba(22,19,15,.6);margin-top:3px}
  .kit a{background:var(--ink);color:var(--white);text-decoration:none;font-weight:600;font-size:13px;
    letter-spacing:.06em;text-transform:uppercase;padding:11px 20px;border-radius:3px;transition:.12s}
  .kit a:hover{background:var(--orange)}
  .grouphead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:30px 0 4px}
  .grouphead h3{margin:0}
  .grouphead a{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);
    text-decoration:none;border-bottom:1.5px solid transparent;transition:.12s}
  .grouphead a:hover{border-bottom-color:var(--orange)}

  /* ---------- MD view ---------- */
  #mdview{display:none;padding:34px 0 0}
  #mdview.on{display:block}
  body.md main>.hero,body.md main>section{display:none}
  body.md #toc ol,body.md #toc>.tt{display:none}   /* 원본 보기에는 앵커가 없다 */
  .mdbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
  .mdbar .p{font-family:var(--mono);font-size:12px;color:rgba(22,19,15,.5)}
  .mdsrc{background:rgba(22,19,15,.04);border:1px solid var(--line);border-radius:6px;padding:20px 22px;
    font-family:var(--mono);font-size:12.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;overflow-x:auto;tab-size:2}

  .foot{padding:44px 0 0;font-size:13px;color:rgba(22,19,15,.5)}
  .foot a{color:var(--orange);text-decoration:none}

  @media(max-width:900px){
    :root{--headh:56px}
    .shell{grid-template-columns:1fr;gap:0}
    .toc{position:static;padding:26px 0 0;border-bottom:1px solid var(--line);padding-bottom:20px}
    .toc ol{display:flex;flex-wrap:wrap;gap:4px 0}
    .toc a{border-left:0;padding:5px 11px 5px 0}
    .toc a.on{border-left:0}
    .toc .other{width:100%}
    .hero{padding:38px 0 30px}
    section{padding:40px 0}
    .nav{padding:11px 16px;gap:12px;flex-wrap:wrap}
    .shell{padding:0 16px}
    .brandmark{order:1}.navtools{order:2;margin-left:auto}.tabs{order:3;width:100%;flex:1 0 100%}
  }
  @media(max-width:520px){
    /* 좁은 화면에서 헤더가 뷰포트를 넘기면 문서 전체가 가로로 밀린다 */
    .nav{padding:10px 14px;gap:8px}
    .shell{padding:0 14px}
    .brandmark img{height:19px}
    .tbtn{font-size:11px;padding:5px 9px;letter-spacing:.05em}
    .ddmenu{min-width:200px}
    .lchip{padding:24px 14px}
    .lchip img{height:56px}
    .lchip.h img{height:26px}
    .kit{flex-direction:column;align-items:stretch}
    .kit a{text-align:center}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brandmark" href="index.html"><img src="assets/logo/logo-wordmark-h-ink.svg" alt="TYPE LOUNGE" height="22"></a>
    <nav class="tabs">{{TABS}}</nav>
    <div class="navtools">
      <button class="tbtn" id="mdtoggle" aria-pressed="false" title="원본 마크다운 보기">MD</button>
      <details class="dd" id="dd">
        <summary class="tbtn">Download <span class="caret">▼</span></summary>
        <div class="ddmenu">
          <a href="{{STANDALONE}}" download>HTML page <small>단일 파일</small></a>
          <a href="md/{{SLUG}}.md" download>MD source <small>{{SLUG}}.md</small></a>
          <a href="type-lounge-logos.zip" download>Logo (SVG) <small>워드마크 전체 zip</small></a>
          <hr>
          <a href="type-lounge-brand-kit.zip" download>Download all <small>{{KITSIZE}}</small></a>
        </div>
      </details>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="toc" id="toc">
    <div class="tt">On this page</div>
    <ol>{{TOC}}</ol>
    <div class="other">
      <div class="tt">Brand book</div>
      {{OTHER}}
    </div>
  </aside>

  <main id="top">
    <div class="hero">
      <div class="kicker">{{KICKER}}</div>
      <h1>{{H1}}</h1>
      <div class="lede">{{LEDE}}</div>
    </div>

{{SECTIONS}}

    <div id="mdview">
      <div class="mdbar">
        <span class="p">07-brand-book/{{SLUG}}.md</span>
        <button class="tbtn" id="mdcopy">Copy</button>
      </div>
      <pre class="mdsrc" id="mdsrc">{{MDSRC}}</pre>
    </div>

    <div class="foot">{{FOOT}}</div>
  </main>
</div>

<script>
(function(){
  // ---- MD view toggle ----
  var body=document.body, btn=document.getElementById('mdtoggle'), view=document.getElementById('mdview');
  function setMd(on,push){
    body.classList.toggle('md',on); view.classList.toggle('on',on);
    btn.setAttribute('aria-pressed',on?'true':'false');
    try{localStorage.setItem('tl-view',on?'md':'doc')}catch(e){}
    if(push){
      var u=new URL(location.href);
      if(on)u.searchParams.set('view','md'); else u.searchParams.delete('view');
      history.replaceState(null,'',u);
    }
  }
  var q=new URLSearchParams(location.search).get('view'), stored=null;
  try{stored=localStorage.getItem('tl-view')}catch(e){}
  setMd(q==='md'||(q===null&&stored==='md'),false);
  btn.addEventListener('click',function(){setMd(!body.classList.contains('md'),true);window.scrollTo({top:0,behavior:'instant'})});

  // ---- copy md ----
  var cp=document.getElementById('mdcopy');
  cp.addEventListener('click',function(){
    navigator.clipboard.writeText(document.getElementById('mdsrc').textContent).then(function(){
      cp.textContent='Copied'; setTimeout(function(){cp.textContent='Copy'},1400);
    });
  });

  // ---- 다운로드: 새 탭으로 열리지 않고 항상 파일로 떨어지게 ----
  // SVG·MD 처럼 브라우저가 직접 렌더할 수 있는 타입은 download 속성만으로는 탐색이 일어난다.
  // 같은 출처면 blob 으로 받아 강제로 저장시킨다. (standalone 단일 파일은 절대 URL이라 제외)
  document.addEventListener('click',function(e){
    var a=e.target.closest && e.target.closest('a[download]');
    if(!a||a.dataset.dl)return;
    var href=a.getAttribute('href')||'';
    if(/^[a-z]+:/i.test(href)&&href.indexOf(location.origin)!==0)return;  // 교차 출처는 브라우저에 맡긴다
    if(!window.fetch||location.protocol==='file:')return;                 // file:// 은 그대로가 더 안전
    e.preventDefault();
    a.dataset.dl='1';
    var name=a.getAttribute('download')||href.split('/').pop().split('?')[0];
    fetch(href).then(function(r){
      if(!r.ok)throw new Error(r.status);
      return r.blob();
    }).then(function(b){
      var u=URL.createObjectURL(b),t=document.createElement('a');
      t.href=u;t.download=name;document.body.appendChild(t);t.click();t.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},2000);
    }).catch(function(){
      location.href=href;                                                 // 실패하면 원래 동작으로
    }).then(function(){delete a.dataset.dl});
  });

  // ---- dropdown: close on outside click / Esc ----
  var dd=document.getElementById('dd');
  document.addEventListener('click',function(e){if(!dd.contains(e.target))dd.removeAttribute('open')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')dd.removeAttribute('open')});
  dd.addEventListener('click',function(e){if(e.target.closest('.ddmenu a'))dd.removeAttribute('open')});

  // ---- scroll spy ----
  var links={}, secs=[].slice.call(document.querySelectorAll('main > section[id]'));
  [].forEach.call(document.querySelectorAll('#toc ol a'),function(a){links[a.getAttribute('href').slice(1)]=a});
  if(secs.length && 'IntersectionObserver' in window){
    var seen={};
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){seen[e.target.id]=e.isIntersecting?e.intersectionRatio:0});
      var best=null,bv=-1;
      secs.forEach(function(s){var v=seen[s.id]||0; if(v>bv){bv=v;best=s.id}});
      if(bv<=0){ // nothing visible: pick last section above the fold
        for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<160)best=secs[i].id}
      }
      Object.keys(links).forEach(function(k){links[k].classList.toggle('on',k===best)});
    },{rootMargin:'-70px 0px -55% 0px',threshold:[0,.05,.25,.5,1]});
    secs.forEach(function(s){io.observe(s)});
  }
})();
</script>
</body>
</html>
