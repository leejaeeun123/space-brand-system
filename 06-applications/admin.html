<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TYPE LOUNGE — 어드민</title>
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#16130F;
    --white:#ffffff;
    --orange:#E2531E;
    --hair: rgba(22,19,15,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Paperlogy', sans-serif;
    background:var(--white);
    color:var(--ink);
    line-height:1.6;
  }

  /* Gate */
  #gate{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:24px;text-align:center;
  }
  #gate .wordmark{font-weight:600;font-size:32px;letter-spacing:-.02em;}
  #gate input{
    font-family:inherit;font-size:16px;text-align:center;letter-spacing:.1em;
    border:1px solid var(--ink);border-radius:8px;padding:12px 16px;width:200px;
  }
  #gate button{
    font-family:inherit;font-weight:600;font-size:15px;
    background:var(--ink);color:var(--white);border:0;border-radius:8px;
    padding:12px 24px;cursor:pointer;
  }
  #gate .error{color:var(--orange);font-size:13px;height:16px;}

  /* App */
  #app{display:none;max-width:640px;margin:0 auto;padding:24px 20px 80px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  header .wordmark{font-weight:600;font-size:22px;letter-spacing:-.02em;}
  header button{
    font-family:inherit;font-size:13px;color:#6b665c;background:none;border:1px solid var(--hair);
    border-radius:8px;padding:6px 12px;cursor:pointer;
  }

  h2{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:32px 0 14px;}
  h2:first-of-type{margin-top:0;}

  /* Calendar */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav button{
    font-family:inherit;font-size:16px;background:none;border:1px solid var(--hair);border-radius:6px;
    width:32px;height:32px;cursor:pointer;color:var(--ink);
  }
  .cal-nav .label{font-weight:600;font-size:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:11px;color:#8a8478;text-align:center;padding:4px 0;font-weight:600;}
  .cal-cell{
    aspect-ratio:1/1;border:1px solid var(--hair);border-radius:6px;padding:4px;
    font-size:12px;cursor:pointer;overflow:hidden;position:relative;
  }
  .cal-cell.empty{border-color:transparent;cursor:default;}
  .cal-cell.today{border-color:var(--ink);}
  .cal-cell.selected{background:var(--ink);color:var(--white);}
  .cal-cell .num{font-weight:600;}
  .cal-cell .chip{font-size:9px;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-cell .more{font-size:9px;color:var(--orange);}
  .cal-cell.selected .more{color:#ffb199;}

  /* Day list */
  .day-label{font-weight:600;font-size:15px;margin-bottom:10px;}
  .res-item{
    border:1px solid var(--hair);border-radius:8px;padding:14px;margin-bottom:10px;
  }
  .res-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .res-item .time{font-weight:600;font-size:15px;}
  .res-item .no{color:#8a8478;font-size:11px;margin-top:2px;}
  .res-item .src{display:inline-block;font-size:10px;color:#6b665c;border:1px solid var(--hair);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  .res-item button{
    font-family:inherit;font-size:12px;color:var(--orange);background:none;border:0;cursor:pointer;
    flex:0 0 auto;
  }
  .res-item dl{
    display:grid;grid-template-columns:64px 1fr;gap:4px 8px;margin-top:10px;font-size:13px;
  }
  .res-item dt{color:#8a8478;}
  .res-item dd{word-break:break-all;}
  .status-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .status-btn{
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
    border:1px solid var(--hair);border-radius:999px;padding:5px 12px;
    background:var(--white);color:#8a8478;
  }
  .status-btn.done{background:var(--ink);color:var(--white);border-color:var(--ink);}

  /* Modal */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(22,19,15,.45);
    align-items:center;justify-content:center;padding:24px;z-index:10;
  }
  .modal-box{
    background:var(--white);border-radius:12px;padding:24px;max-width:280px;width:100%;
    text-align:center;
  }
  .modal-box p{font-size:15px;margin-bottom:20px;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{
    font-family:inherit;font-weight:600;font-size:14px;flex:1;
    border-radius:8px;padding:10px;cursor:pointer;border:1px solid var(--hair);
  }
  .modal-actions .confirm{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .modal-actions .cancel{background:var(--white);color:var(--ink);}
  .empty-note{color:#8a8478;font-size:13px;padding:8px 0;}

  /* Form */
  form{display:grid;gap:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  label{font-size:12px;color:#6b665c;display:block;margin-bottom:4px;}
  input, textarea, select{
    font-family:inherit;font-size:14px;width:100%;
    border:1px solid var(--hair);border-radius:6px;padding:9px 10px;
  }
  fieldset{border:0;padding:0;margin:0;}
  legend{font-size:12px;font-weight:600;color:var(--ink);margin:10px 0 2px;padding:0;}
  form button{
    font-family:inherit;font-weight:600;font-size:14px;
    background:var(--ink);color:var(--white);border:0;border-radius:8px;
    padding:11px;cursor:pointer;margin-top:4px;
  }

  .warn{
    margin-top:32px;padding:12px 14px;border:1px solid var(--hair);border-radius:8px;
    font-size:12px;color:#6b665c;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="wordmark">TYPE LOUNGE</div>
  <div>
    <input type="password" id="pw" inputmode="numeric" placeholder="비밀번호" maxlength="12">
  </div>
  <button onclick="tryUnlock()">입장</button>
  <div class="error" id="pwError"></div>
</div>

<div id="app">
  <header>
    <div class="wordmark">TYPE LOUNGE 어드민</div>
    <button onclick="lock()">로그아웃</button>
  </header>

  <h2>예약 캘린더</h2>
  <div class="cal-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="label" id="calLabel"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <h2>선택한 날짜</h2>
  <div class="day-label" id="dayLabel"></div>
  <div id="dayList"></div>

  <h2>새 예약 추가</h2>
  <form onsubmit="addReservation(event)">
    <fieldset>
      <legend>예약 내용</legend>
      <div class="row2">
        <div>
          <label>예약 구분</label>
          <select id="fSource" required>
            <option value="" disabled selected>선택</option>
            <option value="스클">스클</option>
            <option value="네이버">네이버</option>
          </select>
        </div>
        <div>
          <label>예약번호</label>
          <input type="text" id="fBookingNo" placeholder="예: 10385020">
        </div>
      </div>
      <div class="row2">
        <div>
          <label>신청일</label>
          <input type="date" id="fApplied">
        </div>
        <div></div>
      </div>
      <div class="row3">
        <div>
          <label>이용 날짜</label>
          <input type="date" id="fDate" required>
        </div>
        <div>
          <label>시작 시간</label>
          <input type="time" id="fStart" required>
        </div>
        <div>
          <label>종료 시간</label>
          <input type="time" id="fEnd" required>
        </div>
      </div>
      <div class="row2">
        <div>
          <label>인원수</label>
          <input type="number" id="fGuests" min="1" placeholder="예: 5">
        </div>
        <div>
          <label>사용목적</label>
          <input type="text" id="fPurpose" placeholder="예: 비즈니스 미팅">
        </div>
      </div>
      <div>
        <label>추가옵션</label>
        <input type="text" id="fOption" placeholder="예: 팟캐스트 장비 대여">
      </div>
      <div>
        <label>요청사항</label>
        <input type="text" id="fRequest" placeholder="예약자가 남긴 요청사항">
      </div>
    </fieldset>

    <fieldset>
      <legend>예약자 정보</legend>
      <div>
        <label>예약자명</label>
        <input type="text" id="fName" required placeholder="예: 김민수">
      </div>
      <div class="row2">
        <div>
          <label>연락처</label>
          <input type="tel" id="fPhone" placeholder="선택">
        </div>
        <div>
          <label>이메일</label>
          <input type="email" id="fEmail" placeholder="선택">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>결제 정보</legend>
      <div class="row2">
        <div>
          <label>결제금액</label>
          <input type="number" id="fAmount" min="0" placeholder="예: 16000">
        </div>
        <div>
          <label>결제수단</label>
          <input type="text" id="fPayment" placeholder="예: 네이버페이">
        </div>
      </div>
    </fieldset>

    <div>
      <label>메모 (내부용)</label>
      <input type="text" id="fMemo" placeholder="선택">
    </div>

    <button type="submit">예약 추가</button>
  </form>

  <div class="warn">
    이 예약 데이터는 Supabase DB에 저장돼서 어느 기기에서 열어도 같은 내역이 보여요. 비밀번호는 서버(DB)에서 직접 확인하지만, 그래도 이 페이지 링크와 비밀번호는 형운님만 알고 계셔야 해요.
  </div>
</div>

<div id="statusModal" class="modal-overlay">
  <div class="modal-box">
    <p id="statusModalText"></p>
    <div id="statusModalMsgWrap" style="display:none;text-align:left;">
      <textarea id="statusModalMsg" readonly rows="6" style="width:100%;font-size:12px;font-family:inherit;border:1px solid var(--hair);border-radius:8px;padding:8px;margin-bottom:10px;resize:vertical;"></textarea>
      <button type="button" id="statusModalCopyBtn" class="cancel" onclick="copyStatusMessage()" style="width:100%;margin-bottom:10px;">문자 복사하기</button>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeStatusModal()">취소</button>
      <button class="confirm" onclick="confirmStatusChange()">확인</button>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://sewqusncgznypjigmfde.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNld3F1c25jZ3pueXBqaWdtZmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzM3OTAsImV4cCI6MjEwMTI0OTc5MH0.cMoaJUulz7m56aWQ8neQm013c75dGbCIuzEd8MS2vnI";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var UNLOCK_KEY = "typelounge_admin_password";
  var currentPassword = '';
  var reservationsCache = [];

  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth(); // 0-11
  var selectedDate = fmtDate(today);

  function fmtDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }

  function mapRow(row){
    return {
      id: row.id,
      source: row.source || '',
      bookingNo: row.booking_no || '',
      applied: row.applied || '',
      date: row.date,
      start: (row.start_time || '').slice(0,5),
      end: (row.end_time || '').slice(0,5),
      guests: row.guests,
      purpose: row.purpose || '',
      option: row.option_text || '',
      request: row.request || '',
      name: row.name,
      phone: row.phone || '',
      email: row.email || '',
      amount: row.amount,
      payment: row.payment || '',
      memo: row.memo || '',
      checkinDone: !!row.checkin_done,
      checkoutDone: !!row.checkout_done,
      cleaningDone: !!row.cleaning_done
    };
  }

  function fetchReservations(password){
    return sb.rpc('admin_list_reservations', { p_password: password }).then(function(res){
      if(res.error) throw res.error;
      return (res.data || []).map(mapRow);
    });
  }

  function tryUnlock(){
    var val = document.getElementById('pw').value;
    document.getElementById('pwError').textContent = '확인 중...';
    fetchReservations(val).then(function(list){
      currentPassword = val;
      reservationsCache = list;
      sessionStorage.setItem(UNLOCK_KEY, val);
      document.getElementById('pwError').textContent = '';
      showApp();
    }).catch(function(){
      document.getElementById('pwError').textContent = '비밀번호가 맞지 않아요.';
    });
  }
  function lock(){
    sessionStorage.removeItem(UNLOCK_KEY);
    currentPassword = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('pw').value = '';
  }
  function showApp(){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('fDate').value = selectedDate;
    renderCalendar();
    renderDayList();
  }

  document.getElementById('pw').addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });

  function refresh(){
    return fetchReservations(currentPassword).then(function(list){
      reservationsCache = list;
      renderCalendar();
      renderDayList();
    });
  }

  function changeMonth(delta){
    viewMonth += delta;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  }

  function renderCalendar(){
    var label = viewYear + '년 ' + (viewMonth+1) + '월';
    document.getElementById('calLabel').textContent = label;

    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    var dows = ['일','월','화','수','목','금','토'];
    dows.forEach(function(d){
      var el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    var firstDay = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstDay.getDay();
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var reservations = reservationsCache;
    var todayStr = fmtDate(new Date());

    for(var i=0;i<startWeekday;i++){
      var blank = document.createElement('div');
      blank.className = 'cal-cell empty';
      grid.appendChild(blank);
    }

    for(var day=1; day<=daysInMonth; day++){
      var dateStr = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var cell = document.createElement('div');
      cell.className = 'cal-cell';
      if(dateStr === todayStr) cell.className += ' today';
      if(dateStr === selectedDate) cell.className += ' selected';
      cell.onclick = (function(ds){ return function(){ selectDate(ds); }; })(dateStr);

      var dayRes = reservations.filter(function(r){ return r.date === dateStr; })
        .sort(function(a,b){ return a.start.localeCompare(b.start); });

      var html = '<div class="num">' + day + '</div>';
      dayRes.slice(0,2).forEach(function(r){
        html += '<div class="chip">' + r.start + ' ' + escapeHtml(r.name) + '</div>';
      });
      if(dayRes.length > 2){
        html += '<div class="more">+' + (dayRes.length - 2) + '</div>';
      }
      cell.innerHTML = html;
      grid.appendChild(cell);
    }
  }

  function selectDate(dateStr){
    selectedDate = dateStr;
    document.getElementById('fDate').value = dateStr;
    renderCalendar();
    renderDayList();
  }

  function renderDayList(){
    var d = new Date(selectedDate + 'T00:00:00');
    var dows = ['일','월','화','수','목','금','토'];
    var label = selectedDate.replace(/-/g,'.') + '(' + dows[d.getDay()] + ')';
    document.getElementById('dayLabel').textContent = label;

    var reservations = reservationsCache.filter(function(r){ return r.date === selectedDate; })
      .sort(function(a,b){ return a.start.localeCompare(b.start); });

    var list = document.getElementById('dayList');
    if(reservations.length === 0){
      list.innerHTML = '<div class="empty-note">이 날짜엔 예약이 없어요.</div>';
      return;
    }
    list.innerHTML = '';
    reservations.forEach(function(r){
      var item = document.createElement('div');
      item.className = 'res-item';

      var rows = [];
      if(r.applied) rows.push(['신청일', r.applied]);
      if(r.guests) rows.push(['인원', r.guests + '명']);
      if(r.purpose) rows.push(['목적', r.purpose]);
      if(r.option) rows.push(['옵션', r.option]);
      if(r.request) rows.push(['요청사항', r.request]);
      if(r.phone) rows.push(['연락처', r.phone]);
      if(r.email) rows.push(['이메일', r.email]);
      if(r.amount) rows.push(['결제금액', Number(r.amount).toLocaleString() + '원']);
      if(r.payment) rows.push(['결제수단', r.payment]);
      if(r.memo) rows.push(['메모', r.memo]);

      var dlHtml = rows.map(function(row){
        return '<dt>' + row[0] + '</dt><dd>' + escapeHtml(String(row[1])) + '</dd>';
      }).join('');

      item.innerHTML =
        '<div class="top">' +
          '<div>' +
            '<div class="time">' + r.start + ' – ' + r.end + ' · ' + escapeHtml(r.name) + (r.source ? ' <span class="src">' + escapeHtml(r.source) + '</span>' : '') + '</div>' +
            (r.bookingNo ? '<div class="no">예약번호 ' + escapeHtml(r.bookingNo) + '</div>' : '') +
          '</div>' +
          '<button class="del-btn" data-id="' + r.id + '">삭제</button>' +
        '</div>' +
        '<div class="status-row">' +
          '<button class="status-btn' + (r.checkinDone ? ' done' : '') + '" data-field="checkin">' + (r.checkinDone ? '✓ ' : '') + '입실 안내</button>' +
          '<button class="status-btn' + (r.checkoutDone ? ' done' : '') + '" data-field="checkout">' + (r.checkoutDone ? '✓ ' : '') + '퇴실 안내</button>' +
          '<button class="status-btn' + (r.cleaningDone ? ' done' : '') + '" data-field="cleaning">' + (r.cleaningDone ? '✓ ' : '') + '청소</button>' +
        '</div>' +
        (rows.length ? '<dl>' + dlHtml + '</dl>' : '');
      item.querySelector('.del-btn').onclick = function(){ deleteReservation(r.id); };
      item.querySelectorAll('.status-btn').forEach(function(btn){
        btn.onclick = function(){ openStatusModal(r, btn.getAttribute('data-field')); };
      });
      list.appendChild(item);
    });
  }

  function addReservation(e){
    e.preventDefault();
    var payload = {
      p_password: currentPassword,
      p_source: document.getElementById('fSource').value || null,
      p_booking_no: document.getElementById('fBookingNo').value.trim() || null,
      p_applied: document.getElementById('fApplied').value || null,
      p_date: document.getElementById('fDate').value,
      p_start: document.getElementById('fStart').value,
      p_end: document.getElementById('fEnd').value,
      p_guests: document.getElementById('fGuests').value ? Number(document.getElementById('fGuests').value) : null,
      p_purpose: document.getElementById('fPurpose').value.trim() || null,
      p_option: document.getElementById('fOption').value.trim() || null,
      p_request: document.getElementById('fRequest').value.trim() || null,
      p_name: document.getElementById('fName').value.trim(),
      p_phone: document.getElementById('fPhone').value.trim() || null,
      p_email: document.getElementById('fEmail').value.trim() || null,
      p_amount: document.getElementById('fAmount').value ? Number(document.getElementById('fAmount').value) : null,
      p_payment: document.getElementById('fPayment').value.trim() || null,
      p_memo: document.getElementById('fMemo').value.trim() || null
    };
    if(!payload.p_date || !payload.p_start || !payload.p_end || !payload.p_name) return;

    sb.rpc('admin_add_reservation', payload).then(function(res){
      if(res.error) throw res.error;
      selectedDate = payload.p_date;
      var parts = payload.p_date.split('-');
      viewYear = Number(parts[0]);
      viewMonth = Number(parts[1]) - 1;
      e.target.reset();
      document.getElementById('fDate').value = selectedDate;
      return refresh();
    }).catch(function(err){
      alert('추가하지 못했어요: ' + (err && err.message ? err.message : err));
    });
  }

  function deleteReservation(id){
    if(!confirm('이 예약을 삭제할까요?')) return;
    sb.rpc('admin_delete_reservation', { p_password: currentPassword, p_id: id }).then(function(res){
      if(res.error) throw res.error;
      return refresh();
    }).catch(function(err){
      alert('삭제하지 못했어요: ' + (err && err.message ? err.message : err));
    });
  }

  function formatReservationDateTime(r){
    var d = new Date(r.date + 'T00:00:00');
    var dows = ['일','월','화','수','목','금','토'];
    return r.date.replace(/-/g,'.') + '(' + dows[d.getDay()] + ') ' + r.start;
  }

  function checkinMessage(r){
    return [
      '[타입라운지] 안녕하세요, 이용 안내드립니다 :)',
      '소중한 시간 저희 공간에서 보내주셔서 감사해요. ',
      '',
      '예약 일시: ' + formatReservationDateTime(r),
      '주소: 서울 마포구 월드컵로3길 31-32, 3층 (합정역 8번 출구에서 도보로 5분 정도 걸려요)',
      '',
      '찾아오는 길이랑 공간 이용하는 방법을 아래 페이지에 자세히 정리해뒀어요. 오시기 전에 한 번 훑어보시면 도착해서 헤매지 않고 편하게 이용하실 수 있을 거예요.',
      'https://typelounge.vercel.app',
      '',
      '그리고 혹시 이용하시고 나서 사진 한 장 남기고 리뷰까지 써주시면, 다음에 예약하실 때 이용 시간을 더 챙겨드릴게요!',
      '',
      '이용하시다 궁금하거나 불편한 점 있으면 편하게 연락 주세요.',
      '010-4810-9142',
      '',
      '그럼 좋은 시간 보내세요.',
      '감사합니다!'
    ].join('\n');
  }

  function checkoutMessage(r){
    return [
      '[타입라운지] 퇴실 확인됐습니다 :)',
      '오늘 이용해주셔서 감사해요. 정리 깔끔하게 해주셔서 다음 이용객도 좋은 컨디션으로 시작할 수 있을 것 같아요.',
      '',
      '혹시 아직이시라면, 사진 한 장 남기고 리뷰 써주시면 다음 예약 때 이용 시간을 더 챙겨드려요. 편하실 때 부탁드려요!',
      '',
      '다음에 또 뵙고 싶어요. 좋은 하루 보내세요 :)',
      '—타입라운지 드림'
    ].join('\n');
  }

  var pendingStatus = null;

  function openStatusModal(r, field){
    var current = field === 'checkin' ? r.checkinDone : (field === 'checkout' ? r.checkoutDone : r.cleaningDone);
    var next = !current;
    var labels = { checkin: '입실 안내', checkout: '퇴실 안내', cleaning: '청소' };
    pendingStatus = { id: r.id, field: field, value: next };

    document.getElementById('statusModalText').textContent = labels[field] + (next ? ' 완료로 표시할까요?' : ' 완료를 취소할까요?');

    var msgWrap = document.getElementById('statusModalMsgWrap');
    var msgBox = document.getElementById('statusModalMsg');
    if(next && (field === 'checkin' || field === 'checkout')){
      msgBox.value = field === 'checkin' ? checkinMessage(r) : checkoutMessage(r);
      msgWrap.style.display = 'block';
    }else{
      msgBox.value = '';
      msgWrap.style.display = 'none';
    }

    document.getElementById('statusModalCopyBtn').textContent = '문자 복사하기';
    document.getElementById('statusModal').style.display = 'flex';
  }

  function closeStatusModal(){
    pendingStatus = null;
    document.getElementById('statusModal').style.display = 'none';
  }

  function fallbackCopy(el, done){
    el.focus();
    el.select();
    try{
      document.execCommand('copy');
      done();
    }catch(e){}
  }

  function copyStatusMessage(){
    var msgBox = document.getElementById('statusModalMsg');
    var btn = document.getElementById('statusModalCopyBtn');
    var done = function(){
      btn.textContent = '복사했어요!';
      setTimeout(function(){ btn.textContent = '문자 복사하기'; }, 1500);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(msgBox.value).then(done).catch(function(){ fallbackCopy(msgBox, done); });
    }else{
      fallbackCopy(msgBox, done);
    }
  }

  function confirmStatusChange(){
    if(!pendingStatus) return;
    var rpcName = { checkin: 'admin_set_checkin', checkout: 'admin_set_checkout', cleaning: 'admin_set_cleaning' }[pendingStatus.field];
    sb.rpc(rpcName, { p_password: currentPassword, p_id: pendingStatus.id, p_value: pendingStatus.value }).then(function(res){
      if(res.error) throw res.error;
      closeStatusModal();
      return refresh();
    }).catch(function(err){
      alert('상태를 바꾸지 못했어요: ' + (err && err.message ? err.message : err));
      closeStatusModal();
    });
  }
  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }

  (function(){
    var savedPw = sessionStorage.getItem(UNLOCK_KEY);
    if(savedPw){
      fetchReservations(savedPw).then(function(list){
        currentPassword = savedPw;
        reservationsCache = list;
        showApp();
      }).catch(function(){
        sessionStorage.removeItem(UNLOCK_KEY);
      });
    }
  })();
</script>
