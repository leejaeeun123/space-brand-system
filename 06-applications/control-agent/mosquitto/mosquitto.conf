# 합정 로컬 MQTT 브로커 — Tasmota 조명 전용.
#
# ⚠️ **인증이 기본으로 켜져 있다.** Space의 레포 템플릿은 allow_anonymous true 가 기본이었고,
# 실제 운영 인스턴스는 사람이 SSH로 들어가 수동 하드닝을 했다. 그래서 그쪽 문서에 이런
# 갭이 남아 있다: "이 하드닝은 코드가 아니라 그 머신 위에만 존재한다. 재설치하면
# permissive 기본값이 되살아나고, 재하드닝은 사람이 절차를 다시 밟아야만 한다."
#
# 여기서는 그 순서를 뒤집는다 — 안전한 값이 레포에 있고, 설치하면 그게 그대로 적용된다.
# 비밀번호 파일이 없으면 mosquitto 가 **시작에 실패한다**. 조용히 열린 채로 뜨는 것보다 낫다.

# ── 리스너 ──────────────────────────────────────────────
# 0.0.0.0 = LAN 의 Tasmota 기기가 붙을 수 있어야 하므로 필요하다.
# (127.0.0.1 로 묶으면 이 맥 안에서만 붙고 기기는 조용히 연결 실패한다.)
listener 1883 0.0.0.0

# ── 인증 ────────────────────────────────────────────────
# 익명 접속 금지. 브로커가 LAN 에 열려 있으므로 이게 유일한 관문이다.
allow_anonymous false

# 설치 스크립트가 이 경로를 실제 경로로 바꿔준다.
password_file /opt/homebrew/etc/mosquitto/passwd

# ── 영속성 ──────────────────────────────────────────────
# retained 메시지(전원 상태·LWT)를 재시작 후에도 유지한다.
persistence true
persistence_location /opt/homebrew/var/lib/mosquitto/

# ── 로그 ────────────────────────────────────────────────
log_dest file /opt/homebrew/var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ⚠️ mosquitto 는 **줄 끝 주석을 지원하지 않는다.**
# `listener 1883  # 주석` 처럼 쓰면 주석까지 값에 포함돼 조용히 깨진다.
# 주석은 반드시 자기 줄에 둔다. (Space가 실측 중 밟은 랜드마인)

# ── 브릿지: RPi 브로커 ──────────────────────────────────
# Tasmota 기기는 RPi 브로커(LAN)에 붙고, 맥은 이 브릿지로 tele/stat 를 받아오고
# cmnd 를 내려보낸다. control-agent 는 여전히 localhost:1883 만 보면 된다.
#
# ⚠️ `cmnd/# out` 이 **QoS 0** 이다 — 이 브릿지가 끊긴 동안 발행된 명령은 큐에 쌓이지 않고
# 조용히 버려진다. QoS 를 올려도 근본은 안 바뀐다(브릿지가 죽어 있으면 어차피 못 간다).
# 그래서 control-agent 가 아래 notification 토픽으로 브릿지 생사를 직접 보고,
# 끊겨 있으면 기기 HTTP 로 우회한다(src/tasmota-http.js).
connection rpi-bridge
address 100.94.102.45:1883
topic tele/# in 0
topic stat/# in 0
topic cmnd/# out 0
remote_username nmwc
# 설치 스크립트가 이 자리를 실제 비밀번호로 바꿔준다(control-setup.md B-3).
# mosquitto 에는 remote_password_file 이 없어서 값을 파일 밖으로 뺄 방법이 없다 —
# 그래서 레포에는 자리표시자만 두고, 실제 값은 그 맥의 설정 파일에만 존재한다.
remote_password __RPI_BRIDGE_PASSWORD__
clientid mac-bridge-rpi
try_private false
cleansession false
start_type automatic
# ⚠️ **control-agent 가 이 두 줄에 의존한다 — 지우지 말 것.**
# 이걸 끄면 브릿지가 죽어도 에이전트는 로컬 발행 성공만 보고 '보냈다'고 기록한다.
# 그게 정확히 고친 버그다(commands.js).
notifications true
notification_topic $SYS/broker/connection/rpi-bridge/state
restart_timeout 5 30
keepalive_interval 30
bridge_protocol_version mqttv311

# ── 브릿지: AWS IoT Core ────────────────────────────────
# tele/stat 는 Pi 가 발신·맥이 수신으로 고정(rpi-bridge 에서 받은 걸 그대로 위로 올린다).
# cmnd 는 AWS 발신 → 맥 수신 → rpi-bridge 로 Pi 까지 릴레이. 겹치는 방향이 없다.
#
# 인증서 3종은 레포에 없다. 설치할 때 이 경로에 직접 놓는다(control-setup.md B-3).
# 특히 private.pem.key 는 **개인키라 절대 커밋하지 않는다.**
#
# 인증서가 없어도 브로커는 정상 기동하고 조명은 그대로 돈다 — 이 브릿지만 실패하고
# 재시도한다(mosquitto 2.1.2 실측). 클라우드 릴레이를 안 쓸 현장이면 이 블록을 통째로
# 지운다. 남겨두면 로그에 CA 로드 실패가 계속 쌓인다.
connection aws-iot-bridge
address a2way4ke8n3nb6-ats.iot.ap-northeast-2.amazonaws.com:8883
topic tele/# out 1
topic stat/# out 1
topic cmnd/# in 1
bridge_cafile /opt/homebrew/etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /opt/homebrew/etc/mosquitto/certs/certificate.pem.crt
bridge_keyfile /opt/homebrew/etc/mosquitto/certs/private.pem.key
bridge_insecure false
clientid mac-bridge-aws
cleansession true
start_type automatic
notifications false
restart_timeout 10 60
keepalive_interval 60
bridge_protocol_version mqttv311
try_private false
