# 합정 로컬 MQTT 브로커 — Tasmota 조명 전용.
#
# ⚠️ **인증이 기본으로 켜져 있다.** Space의 레포 템플릿은 allow_anonymous true 가 기본이었고,
# 실제 운영 인스턴스는 사람이 SSH로 들어가 수동 하드닝을 했다. 그래서 그쪽 문서에 이런
# 갭이 남아 있다: "이 하드닝은 코드가 아니라 그 머신 위에만 존재한다. 재설치하면
# permissive 기본값이 되살아나고, 재하드닝은 사람이 절차를 다시 밟아야만 한다."
#
# 여기서는 그 순서를 뒤집는다 — 안전한 값이 레포에 있고, 설치하면 그게 그대로 적용된다.
# 비밀번호 파일이 없으면 mosquitto 가 **시작에 실패한다**. 조용히 열린 채로 뜨는 것보다 낫다.

# ── 리스너 ──────────────────────────────────────────────
# 0.0.0.0 = LAN 의 Tasmota 기기가 붙을 수 있어야 하므로 필요하다.
# (127.0.0.1 로 묶으면 이 맥 안에서만 붙고 기기는 조용히 연결 실패한다.)
listener 1883 0.0.0.0

# ── 인증 ────────────────────────────────────────────────
# 익명 접속 금지. 브로커가 LAN 에 열려 있으므로 이게 유일한 관문이다.
allow_anonymous false

# 설치 스크립트가 이 경로를 실제 경로로 바꿔준다.
password_file /opt/homebrew/etc/mosquitto/passwd

# ── 영속성 ──────────────────────────────────────────────
# retained 메시지(전원 상태·LWT)를 재시작 후에도 유지한다.
persistence true
persistence_location /opt/homebrew/var/lib/mosquitto/

# ── 로그 ────────────────────────────────────────────────
log_dest file /opt/homebrew/var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ⚠️ mosquitto 는 **줄 끝 주석을 지원하지 않는다.**
# `listener 1883  # 주석` 처럼 쓰면 주석까지 값에 포함돼 조용히 깨진다.
# 주석은 반드시 자기 줄에 둔다. (Space가 실측 중 밟은 랜드마인)

# ── 브릿지: RPi 브로커 ──────────────────────────────────
# Tasmota 기기는 RPi 브로커(LAN)에 붙고, 맥은 이 브릿지로 tele/stat 를 받아오고
# cmnd 를 내려보낸다. control-agent 는 여전히 localhost:1883 만 보면 된다.
#
# ⚠️ `cmnd/# out` 이 **QoS 0** 이다 — 이 브릿지가 끊긴 동안 발행된 명령은 큐에 쌓이지 않고
# 조용히 버려진다. QoS 를 올려도 근본은 안 바뀐다(브릿지가 죽어 있으면 어차피 못 간다).
# 그래서 이 경로 하나에만 기대지 않는다 — 아래 aws-iot-cmnd-bridge 가 같은 `cmnd/#` 를
# **항상 병렬로** 릴레이하고, 그래도 기기가 답을 안 하면 control-agent 가 기기 HTTP 로
# 우회한다(src/tasmota-http.js).
connection rpi-bridge
address 100.94.102.45:1883
topic tele/# in 0
topic stat/# in 0
topic cmnd/# out 0
remote_username nmwc
# 설치 스크립트가 이 자리를 실제 비밀번호로 바꿔준다(control-setup.md B-3).
# mosquitto 에는 remote_password_file 이 없어서 값을 파일 밖으로 뺄 방법이 없다 —
# 그래서 레포에는 자리표시자만 두고, 실제 값은 그 맥의 설정 파일에만 존재한다.
remote_password __RPI_BRIDGE_PASSWORD__
clientid mac-bridge-rpi
try_private false
cleansession false
start_type automatic
# control-agent 가 이 두 줄을 **관측용으로** 읽는다(src/mqtt.js). 브릿지가 끊기면 로그에
# 남아서 "조명이 왜 느리지"를 추적할 때 첫 단서가 된다.
# 예전에는 이 값이 배달 경로 판정에도 쓰였다 — 끊겨 있으면 발행을 건너뛰고 바로 HTTP 로
# 갔다. 지금은 아니다: aws-iot-cmnd-bridge 가 병렬로 릴레이하므로 이 브릿지가 죽었다는 게
# 곧 유실 확정이 아니게 됐고, 그때 HTTP 로 직행하면 AWS 로 간 사본이 확인될 기회를 뺏는다.
notifications true
notification_topic $SYS/broker/connection/rpi-bridge/state
restart_timeout 5 30
keepalive_interval 30
bridge_protocol_version mqttv311

# ── 브릿지: AWS IoT Core (상행 tele/stat 전용) ──────────
# rpi-bridge 에서 받은 tele/stat 를 그대로 위로 올린다.
#
# ⚠️ **한 접두사를 두 브릿지가 서로 반대 방향으로 실으면 무한 루프가 된다 — 이 파일의
# 가장 중요한 불변식이다.** mosquitto 는 "들어온 브릿지로 되돌려 보내지 않기"만 하고,
# **다른 브릿지로 나가는 것은 막지 않는다.** 그래서 이 블록의 `X out` 과 아래 블록의
# `X in` 이 같은 X 를 가리키면 메시지가 맥 ↔ AWS 를 영원히 왕복한다(AWS IoT 는 건당
# 과금이다). 지금 배치는 이렇게 갈라져 있다:
#   tele/stat → 이 블록만 `out`      (아래 블록은 stat 을 아예 안 싣는다)
#   cmnd      → 아래 블록만 `out`    (이 블록에서 `cmnd/# in` 을 뺀 이유가 이것이다)
#
# `topic cmnd/# in 1` 을 지웠다. 원래 의도는 "AWS 발신 → 맥 수신 → rpi-bridge 로 Pi 까지
# 릴레이" 였는데, (1) AWS 의 `cmnd/*` 로 실제로 발행하는 코드가 이 레포에 없고
# (유일한 명령 생산자는 Supabase Realtime 을 받는 control-agent 이고 그건 로컬 발행이다),
# (2) Pi 의 자체 AWS 브릿지가 이미 `cmnd/*` 를 직접 구독하므로 맥을 경유할 이유가 없다.
# 남겨두면 아래 브릿지의 `cmnd/# out` 과 정확히 위 루프를 만든다.
#
# 인증서 3종은 레포에 없다. 설치할 때 이 경로에 직접 놓는다(control-setup.md B-3).
# 특히 private.pem.key 는 **개인키라 절대 커밋하지 않는다.**
#
# 인증서가 없어도 브로커는 정상 기동하고 조명은 그대로 돈다 — 이 브릿지만 실패하고
# 재시도한다(mosquitto 2.1.2 실측). 클라우드 릴레이를 안 쓸 현장이면 **이 블록과 아래
# aws-iot-cmnd-bridge 블록을 둘 다** 지운다. 남겨두면 로그에 CA 로드 실패가 계속 쌓인다.
connection aws-iot-bridge
address a2way4ke8n3nb6-ats.iot.ap-northeast-2.amazonaws.com:8883
topic tele/# out 1
topic stat/# out 1
bridge_cafile /opt/homebrew/etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /opt/homebrew/etc/mosquitto/certs/certificate.pem.crt
bridge_keyfile /opt/homebrew/etc/mosquitto/certs/private.pem.key
bridge_insecure false
clientid mac-bridge-aws
cleansession true
start_type automatic
notifications false
restart_timeout 10 60
keepalive_interval 60
bridge_protocol_version mqttv311
try_private false

# ── 브릿지: AWS IoT Core (하행 cmnd 전용) ───────────────
# **이 브릿지는 rpi-bridge 와 경쟁하지 않는다 — 나란히 간다.** 같은 `cmnd/#` 를 두 경로로
# 동시에 내보내는 게 의도다. 오해하고 "중복이니 하나 지우자"고 하지 말 것.
#
# 왜 이렇게 하나: rpi-bridge 는 tailscale 위에 있고 `cmnd/# out` 이 QoS 0 이라, 그 링크가
# 끊긴 순간의 명령은 큐에 쌓이지도 않고 사라진다. Pi 는 자체 AWS 브릿지로 `cmnd/*` 를
# 직접 구독하므로, AWS 로 올린 사본은 tailscale 과 **완전히 무관하게** 기기까지 간다.
# 경로가 둘이면 한쪽이 죽어도 명령이 산다.
#
# 왜 조건부가 아니라 **항상** 인가: mosquitto 에는 "다른 브릿지가 죽었을 때만 이 토픽을
# 실어라" 를 표현할 방법이 없다. 브릿지 방향은 정적이다. 그래서 "tailscale 먼저, 안 되면
# AWS" 같은 순차 시도는 이 계층에서 만들 수 없다 — 그래도 괜찮은 이유는 **우리가 보내는
# 명령이 전부 멱등**이기 때문이다. 이 시스템이 실제로 내보내는 것은 `POWER ON` /
# `POWER OFF` 둘뿐이고(TOGGLE 은 안 쓴다 — src/delivery.js 의 parseCommandTopic 주석),
# 같은 값을 두 번 받는 것과 한 번 받는 것의 결과가 같다. 중복 배달은 손해가 아니다.
#
# ⚠️ **`topic stat/# in` 을 일부러 안 넣었다.** 위 aws-iot-bridge 가 `stat/# out` 을
# 실으므로, 여기에 `stat/# in` 을 넣으면 stat 이 맥 ↔ AWS 를 무한 왕복한다(위 블록의
# 루프 불변식 참조). 그래서 기기의 `stat` 확인 응답은 **여전히 rpi-bridge 로만** 돌아온다 —
# tailscale 이 끊긴 동안에는 명령이 AWS 로 나가 기기에 닿아도 맥은 확인을 못 받고,
# 4초 뒤 기기 HTTP 로 한 번 더 보낸다(멱등이라 무해하다).
#
# 인증서는 aws-iot-bridge 와 **공유하지 않는다.** 이쪽 신원은 `cmnd/*` 에 발행 권한이
# 필요하고 저쪽은 `tele/*`·`stat/*` 에 필요해서, IoT 정책이 서로 다르다. 한 인증서에
# 두 권한을 합치면 상행 전용이어야 할 신원이 명령까지 쏠 수 있게 된다(control-setup.md B-3).
connection aws-iot-cmnd-bridge
address a2way4ke8n3nb6-ats.iot.ap-northeast-2.amazonaws.com:8883
topic cmnd/# out 0
bridge_cafile /opt/homebrew/etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /opt/homebrew/etc/mosquitto/certs/cmnd-bridge-certificate.pem.crt
bridge_keyfile /opt/homebrew/etc/mosquitto/certs/cmnd-bridge-private.pem.key
bridge_insecure false
clientid typelounge-cmnd-bridge
cleansession true
start_type automatic
notifications false
restart_timeout 10 60
keepalive_interval 60
bridge_protocol_version mqttv311
# mosquitto 기본값 true 는 순수 mosquitto 확장이라 AWS IoT Core 가 CONNECT 를 끊는다
# (control-setup.md '막혔을 때' 2026-08-12 항목). aws-iot-bridge 와 같은 이유로 false.
try_private false
