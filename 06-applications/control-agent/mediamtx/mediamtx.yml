# MediaMTX — 합정 맥의 CCTV 서버. 실시간 시청과 녹화를 한 프로세스가 다 한다.
#
#   Tapo ──RTSP(LAN)──> [MediaMTX] ──HLS/재생──> cloudflared ──> admin.html
#                            └──> 디스크(fMP4 세그먼트)
#
# 이 파일은 **템플릿이다.** <> 로 감싼 값을 채워 실제 설정 파일로 복사한다(cctv-setup.md).
# 채우지 않은 채로 두면 MediaMTX가 뜨긴 하지만 인증이 비어 누구나 볼 수 있게 된다.
#
# ⚠️ 인증을 MediaMTX 내장(authInternalUsers)으로 두는 이유는 비용이다. 외부 인증 서버
# (authMethod: http)를 붙이면 **HLS 플레이리스트·세그먼트 매 요청마다** 인증 요청이 가고
# 그건 초당 4~5회다 — 카메라 한 대를 하루 켜두면 Edge Function 호출 35만 건으로 무료 한도를
# 하루 만에 넘긴다. 그래서 검증은 여기서 하고, 이 계정을 admin에 알려주는 일만 서버가 맡는다.

###############################################
# 전역

logLevel: info

# API. 에이전트(control-agent)가 '스트림이 살아 있나'를 물으러 온다.
# **반드시 127.0.0.1 에 묶는다** — 터널로 나가면 인증 없이 서버를 조작할 수 있다.
api: yes
apiAddress: 127.0.0.1:9997

# 안 쓰는 프로토콜은 전부 끈다. 열려 있는 포트는 언젠가 누가 찾아온다.
rtsp: no
rtmp: no
srt: no
webrtc: no      # WebRTC 미디어는 UDP라 Cloudflare Tunnel(TCP)을 못 지난다 — HLS로 본다
hls: yes
playback: yes

###############################################
# 인증
#
# 계정은 하나뿐이고 **read/playback 만** 준다. publish 를 주지 않는 게 중요하다 —
# 주면 자격증명을 쥔 사람이 카메라 스트림을 가짜 영상으로 덮어쓸 수 있다.
# (아래 paths 의 source 는 서버가 직접 당겨오는 것이라 이 인증을 거치지 않는다.)
#
# 이 user/pass 는 Supabase 시크릿 CAMERA_STREAM_USER/CAMERA_STREAM_PASS 와 **같아야** 한다.
# 회수할 때는 양쪽을 같이 바꾼다 — 한쪽만 바꾸면 화면이 통째로 안 나온다.

authMethod: internal
authInternalUsers:
  - user: <스트림계정>
    pass: <스트림비번>
    ips: []
    permissions:
      - action: read
      - action: playback

  # API·메트릭은 위 계정과 무관하게 localhost 에서만 열린다(apiAddress 참조).
  # 익명에 api 를 주지 않으면 에이전트가 매번 인증해야 하므로, localhost 한정으로 허용한다.
  - user: any
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api

###############################################
# HLS — 실시간 시청
#
# lowLatency 는 켜지 않는다. LL-HLS 는 왕복이 잦아 터널 뒤에서 오히려 자주 끊기고,
# 얻는 건 1~2초다. "지금 저기 사람 있나"에는 3초 지연이 아무 문제가 없다.

hlsAddress: :8888
hlsVariant: mpegts
# 기본값 7을 그대로 쓴다. 3으로 줄이면 라이브 윈도우가 3초뿐이라 터널 지터 한 번에
# 플레이어가 윈도우 밖으로 밀려나 끊긴다 — 아낄 이유가 없는 3초다.
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsAlwaysRemux: yes   # 아무도 안 보고 있어도 remux 를 유지한다 — 열자마자 뜨게 하려고

###############################################
# 재생 — 녹화 되감기

playbackAddress: :9996

###############################################
# 녹화
#
# ⚠️ 보관기간(recordDeleteAfter)은 **안내판·이용약관에 적은 일수 및 Supabase 시크릿
# CAMERA_RETENTION_DAYS 와 같아야 한다.** 세 값이 어긋나면 어드민이 실제보다 긴
# 보관기간을 말하게 되고, 손님에게도 안내판으로 그렇게 약속한 것이 된다.
#
# 법정 일수는 없다. 목적 달성에 필요한 최소기간이고, 산정이 곤란하면 30일 이내 권고다.
# 짧은 쪽이 법적으로도 더 안전하다 — 길게 두면 그만큼 지켜야 할 것이 늘어난다.
#
# ⚠️ 용량을 먼저 계산한다. MediaMTX는 받은 영상을 다시 인코딩하지 않고 그대로 떨군다 —
# 즉 카메라가 보내는 비트레이트가 그대로 디스크 소모다.
#
#   고화질(stream1, 1080p~2K)  ≈ 하루 20~40GB/대  → 7일 140~280GB
#   저화질(stream2, 640x360)  ≈ 하루  3~5GB/대  → 30일  90~150GB
#
# 기본값은 **고화질 7일**로 둔다. 분쟁(파손·초과인원)은 대개 며칠 안에 드러나고,
# 640x360은 그 순간 "뭐가 찍혔는지 알아볼 수 없는" 화질이라 보관기간만 길고 쓸모가 없다.
# 더 길게 보관해야 하면 paths 의 source 를 stream2 로 바꾸고 이 값을 올린다 —
# 그때 세 군데(이 파일·시크릿·안내판)를 같이 고친다.
#
# 디스크가 차면 **녹화만 조용히 멈춘다**(실시간 화면은 멀쩡히 나온다). 그래서 에이전트가 남은 용량과
# 최근 세그먼트 갱신 시각을 어드민에 계속 띄운다.

record: yes
recordPath: <녹화경로>/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 1h
recordDeleteAfter: 7d

###############################################
# 카메라
#
# 이름(키)이 곧 어드민에 등록하는 **스트림 이름**이다. 한 글자라도 다르면 카드는 뜨는데
# 영상만 안 나온다. 영소문자·숫자·_·- 32자 이내.
#
# Tapo RTSP 주소:
#   rtsp://<카메라계정>:<카메라비번>@<카메라IP>:554/stream1   (고화질)
#   rtsp://<카메라계정>:<카메라비번>@<카메라IP>:554/stream2   (저화질)
# 카메라 계정은 Tapo 앱 → 고급 설정 → 카메라 계정에서 따로 만든다(Tapo 로그인 계정과 다르다).
#
# sourceOnDemand: no — 아무도 안 보고 있어도 계속 물고 있는다. 녹화가 목적이므로 필수다.
# 켜면 아무도 화면을 안 볼 때 녹화가 멈춘다.

# ⚠️ **오디오를 받으면 위법이다.** 「개인정보 보호법」 제25조 제5항은 고정형 영상정보처리기기의
# **녹음기능 사용을 금지**한다(과태료 대상). Tapo는 마이크가 내장돼 있고 RTSP 스트림에 오디오
# 트랙이 기본으로 실리며, MediaMTX는 받은 트랙을 전부 녹화한다 — 즉 **아무 설정도 안 하면
# 위법 녹음이 자동으로 된다.**
#
# **MediaMTX에는 오디오를 버리는 설정이 없다.** 프록시한 소스의 트랙은 전부 그대로 흐른다.
# 그래서 차단은 **카메라 쪽에서만** 가능하다 — C-2에서 마이크를 끄고 VLC로 오디오 트랙이
# 없는 걸 눈으로 확인한다.
#
# 설정으로 못 막으니 **감시가 유일한 방어**다. 그래서 에이전트가 MediaMTX API의 트랙 목록을
# 주기적으로 읽어 오디오가 섞이면 어드민에 경고를 띄운다(control-agent/src/cameras.js).
# 펌웨어 업데이트나 앱 재설정으로 마이크가 조용히 되살아나는 경우를 잡기 위한 것이다.
# 경고가 뜨면 카메라 설정을 다시 확인하고, 그동안 쌓인 녹화는 파기한다.

paths:
  entrance:
    source: rtsp://<카메라계정>:<카메라비번>@<카메라 IP>:554/stream1
    sourceOnDemand: no

  # 카메라를 늘릴 때 이 블록을 복사한다. 어드민에도 같은 이름으로 등록해야 보인다.
  # lounge:
  #   source: rtsp://<카메라계정>:<카메라비번>@<카메라 IP2>:554/stream1
  #   sourceOnDemand: no
