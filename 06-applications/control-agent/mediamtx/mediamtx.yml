# MediaMTX — 합정 맥의 CCTV 서버. **실시간 시청만** 한다. 서버 녹화는 껐다(record: no, 2026-08-10 현장 지시).
#
#   카메라 ──RTSP(영상+오디오)──> ffmpeg(-an, 오디오 폐기) ──RTSP──> [MediaMTX](127.0.0.1:8554) ──HLS──> cloudflared ──> admin.html
#
#   ⚠️ 카메라는 MediaMTX에 **직접 붙지 않는다.** 중간의 ffmpeg -an 재발행(camera-republish.sh)이 유일 경로다(아래 paths·인증 참조).
#   ⚠️ 서버 녹화는 껐다 — 영상은 카메라 SD카드에만 남고 맥에는 저장하지 않는다.
#
# 이 파일은 **템플릿이다.** <> 로 감싼 값을 채워 실제 설정 파일로 복사한다(cctv-setup.md).
# 채우지 않은 채로 두면 MediaMTX가 뜨긴 하지만 인증이 비어 누구나 볼 수 있게 된다.
#
# ⚠️ 인증을 MediaMTX 내장(authInternalUsers)으로 두는 이유는 비용이다. 외부 인증 서버
# (authMethod: http)를 붙이면 **HLS 플레이리스트·세그먼트 매 요청마다** 인증 요청이 가고
# 그건 초당 4~5회다 — 카메라 한 대를 하루 켜두면 Edge Function 호출 35만 건으로 무료 한도를
# 하루 만에 넘긴다. 그래서 검증은 여기서 하고, 이 계정을 admin에 알려주는 일만 서버가 맡는다.

###############################################
# 전역

logLevel: info

# API. 에이전트(control-agent)가 '스트림이 살아 있나'를 물으러 온다.
# **반드시 127.0.0.1 에 묶는다** — 터널로 나가면 인증 없이 서버를 조작할 수 있다.
api: yes
apiAddress: 127.0.0.1:9997

# 안 쓰는 프로토콜은 전부 끈다. 열려 있는 포트는 언젠가 누가 찾아온다.
# ⚠️ rtsp 는 켠다 — 다만 **127.0.0.1 에만 묶는다.** 카메라가 직접 붙는 게 아니라, 오디오를 떼는
#    로컬 ffmpeg 재발행(camera-republish.sh)이 rtsp://127.0.0.1:8554/<path> 로 이 포트에 publish 한다.
#    LAN에 열면 카메라 직결·가짜 스트림 덮어쓰기가 가능해지므로 반드시 localhost 한정이다.
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtmp: no
srt: no
webrtc: no      # WebRTC 미디어는 UDP라 Cloudflare Tunnel(TCP)을 못 지난다 — HLS로 본다
hls: yes
# ⚠️ 되감기(playback)는 껐다 — 2026-08-10 현장 지시로 서버 녹화를 끄면서 같이 껐다. 되살리려면
#    아래 녹화 절과 함께 켠다.
playback: no

###############################################
# 인증
#
# 스트림 계정(admin 시청용)에는 read/playback 만 준다(지금 playback 은 꺼져 있어 read 만 동작).
# publish 는 주지 않는 게 중요하다 — 주면 자격증명을 쥔 사람이 카메라 화면을 가짜 영상으로 덮어쓴다.
# ⚠️ 이제 paths 가 전부 source: publisher 라 publish 경로가 필요하다 — 아래 localhost(any) 계정에만
# publish 를 준다. ffmpeg 재발행이 rtsp://127.0.0.1:8554 로 publish 하고, 그 포트는 rtspAddress 로
# 127.0.0.1 에만 열려 있어 로컬 프로세스(재발행)만 publish 할 수 있다.
#
# 이 user/pass 는 Supabase 시크릿 CAMERA_STREAM_USER/CAMERA_STREAM_PASS 와 **같아야** 한다.
# 회수할 때는 양쪽을 같이 바꾼다 — 한쪽만 바꾸면 화면이 통째로 안 나온다.

authMethod: internal
authInternalUsers:
  - user: <스트림계정>
    pass: <스트림비번>
    ips: []
    permissions:
      - action: read
      - action: playback

  # localhost 전용 계정. api(에이전트가 '스트림 살아있나' 질의)와 publish(ffmpeg 재발행)를 준다.
  # 익명에 api 를 주지 않으면 에이전트가 매번 인증해야 하고, publish 는 재발행이 자격증명 없이
  # 127.0.0.1:8554 로 밀어넣기 위해 필요하다. 둘 다 localhost 한정이라 외부에서는 쓸 수 없다.
  - user: any
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: publish

###############################################
# HLS — 실시간 시청
#
# lowLatency 는 켜지 않는다. LL-HLS 는 왕복이 잦아 터널 뒤에서 오히려 자주 끊기고,
# 얻는 건 1~2초다. "지금 저기 사람 있나"에는 3초 지연이 아무 문제가 없다.

hlsAddress: :8888
hlsVariant: mpegts
# 기본값 7을 그대로 쓴다. 3으로 줄이면 라이브 윈도우가 3초뿐이라 터널 지터 한 번에
# 플레이어가 윈도우 밖으로 밀려나 끊긴다 — 아낄 이유가 없는 3초다.
hlsSegmentCount: 7
hlsSegmentDuration: 4s   # 2026-08-10 1s→4s. Cloudflare Free 가 서울 트래픽을 LA 엣지로 보내(cctv-setup.md "태평양") 세그먼트 요청이 왕복마다 비싸다 — 4s면 요청 수가 1/4. count 7 그대로면 라이브 윈도우 28초
hlsAlwaysRemux: yes   # 아무도 안 보고 있어도 remux 를 유지한다 — 열자마자 뜨게 하려고

###############################################
# 재생 — 녹화 되감기. 지금은 playback: no 라 이 주소는 열리지 않는다(서버 녹화를 다시 켤 때 함께 켠다).

playbackAddress: :9996

###############################################
# 녹화 — ⚠️ **지금은 껐다(record: no, 2026-08-10 현장 지시).** 서버는 아무것도 저장하지 않는다.
#         그래서 아래 recordDeleteAfter·용량 계산·보관기간 동기화는 **전부 휴면**이다 — 집행할 녹화가 없다.
#         서버 녹화를 다시 켜는 순간(record: yes) 아래가 되살아나므로, 그때 recordDeleteAfter 를 손님
#         고지(guest-guide.html #cctv)·현장 안내판·시크릿 CAMERA_RETENTION_DAYS 와 같은 숫자로 맞춘다.
#
# ⚠️ 보관기간(recordDeleteAfter)은 **안내판·이용약관에 적은 일수 및 Supabase 시크릿
# CAMERA_RETENTION_DAYS 와 같아야 한다.** 세 값이 어긋나면 어드민이 실제보다 긴
# 보관기간을 말하게 되고, 손님에게도 안내판으로 그렇게 약속한 것이 된다.
#
# 법정 일수는 없다. 목적 달성에 필요한 최소기간이고, 산정이 곤란하면 30일 이내 권고다.
# 짧은 쪽이 법적으로도 더 안전하다 — 길게 두면 그만큼 지켜야 할 것이 늘어난다.
#
# ⚠️ 용량을 먼저 계산한다. MediaMTX는 받은 영상을 다시 인코딩하지 않고 그대로 떨군다 —
# 즉 카메라가 보내는 비트레이트가 그대로 디스크 소모다.
#
#   고화질(stream1, 1080p~2K)  ≈ 하루 20~40GB/대  → 7일 140~280GB
#   저화질(stream2, 640x360)  ≈ 하루  3~5GB/대  → 30일  90~150GB
#
# 기본값은 **고화질 7일**로 둔다. 분쟁(파손·초과인원)은 대개 며칠 안에 드러나고,
# 640x360은 그 순간 "뭐가 찍혔는지 알아볼 수 없는" 화질이라 보관기간만 길고 쓸모가 없다.
# 더 길게 보관해야 하면 paths 의 source 를 stream2 로 바꾸고 이 값을 올린다 —
# 그때 세 군데(이 파일·시크릿·안내판)를 같이 고친다.
#
# 디스크가 차면 **녹화만 조용히 멈춘다**(실시간 화면은 멀쩡히 나온다). 그래서 에이전트가 남은 용량과
# 최근 세그먼트 갱신 시각을 어드민에 계속 띄운다.

record: no          # ⚠️ 껐다(2026-08-10). 켜면 위 주석대로 recordDeleteAfter 를 4곳과 맞춘다.
recordPath: <녹화경로>/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 1h
recordDeleteAfter: 7d

###############################################
# 카메라
#
# 이름(키)이 곧 어드민에 등록하는 **스트림 이름**이다. 한 글자라도 다르면 카드는 뜨는데
# 영상만 안 나온다. 영소문자·숫자·_·- 32자 이내.
#
# ⚠️ paths 는 전부 source: publisher 다 — 카메라를 여기 직접 걸지 않는다.
# 카메라 RTSP(오디오 포함)를 로컬 ffmpeg 가 -an 으로 오디오를 떼어 rtsp://127.0.0.1:8554/<path> 로
# 다시 밀어넣고(camera-republish.sh), MediaMTX 는 그 무음 스트림을 받는다. 카메라를 source 로 직접
# 걸면 오디오가 딸려 들어와 서버에 흐르고, record 를 켠 상태라면 그대로 위법 녹음이 된다(§25⑤).
# 그래서 -an 재발행이 유일 경로다.
#
#   카메라 RTSP 주소·계정·IP 는 이 파일이 아니라 camera-republish.sh 와 그 폴더 .env
#   (CAM_RTSP_USER/CAM_RTSP_PASS) · camera-relay-all.sh(카메라 IP 목록)에 있다.

# ⚠️ **오디오를 받으면 위법이다.** 「개인정보 보호법」 제25조 제5항은 고정형 영상정보처리기기의
# **녹음기능 사용을 금지**한다(과태료 대상). Tapo는 마이크가 내장돼 있고 RTSP 스트림에 오디오
# 트랙이 기본으로 실리며, MediaMTX는 받은 트랙을 전부 녹화한다 — 즉 **아무 설정도 안 하면
# 위법 녹음이 자동으로 된다.**
#
# **MediaMTX에는 오디오를 버리는 설정이 없다.** 프록시한 소스의 트랙은 전부 그대로 흐른다.
# 그래서 차단은 **카메라 쪽에서만** 가능하다 — C-2에서 마이크를 끄고 VLC로 오디오 트랙이
# 없는 걸 눈으로 확인한다.
#
# 설정으로 못 막으니 **감시가 유일한 방어**다. 그래서 에이전트가 MediaMTX API의 트랙 목록을
# 주기적으로 읽어 오디오가 섞이면 어드민에 경고를 띄운다(control-agent/src/cameras.js).
# 펌웨어 업데이트나 앱 재설정으로 마이크가 조용히 되살아나는 경우를 잡기 위한 것이다.
# 경고가 뜨면 카메라 설정을 다시 확인하고, 그동안 쌓인 녹화는 파기한다.

paths:
  # 출입구 — 누가 언제 드나들었나. 분쟁 때 가장 자주 다시 보게 되는 쪽이다.
  office:
    source: publisher

  # 실내 라운지(좌) — 무슨 일이 있었나. 화장실이 화각에 들어가면 위법이니 각도를 바꾼다
  # (개인정보 보호법 §25, cctv-setup.md C-0).
  lounge_left:
    source: publisher

  # 실내 라운지(우)
  lounge_right:
    source: publisher

  # 카메라를 더 늘릴 때: 위 블록을 복사하고 camera-relay-all.sh 의 CAMERAS 배열에 IP 를 더한다.
  # 어드민에도 같은 이름(키)으로 등록해야 보인다.
